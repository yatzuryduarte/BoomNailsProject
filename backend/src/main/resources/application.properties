
spring.application.name=backend

# Conexion a MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/BoomNailsDB_V2
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA: no crear ni modificar tablas
spring.jpa.hibernate.ddl-auto=none

# Mostrar consultas SQL durante el desarrollo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Puerto del backend
server.port=8080


# Configuración de carga de imágenes
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Directorio privado para comprobantes de pago
app.upload.receipts-directory=./uploads/comprobantes

# Configuración JWT
security.jwt.secret=${JWT_SECRET}
security.jwt.expiration-minutes=60

